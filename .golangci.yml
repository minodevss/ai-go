version: "2"

run:
  go: "1.26"
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - staticcheck
    - testableexamples
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
    perfsprint:
      err-error: true
      strconcat: false
    revive:
      enable-default-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
    unparam:
      check-exported: false
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/minodevss/ai-go
    goimports:
      local-prefixes:
        - github.com/minodevss/ai-go
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
